<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="laundryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
  </defs>
  <!-- Squircle base -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#laundryGrad)" />
  <!-- Teardrop outline -->
  <path d="M 256 120 C 256 120 152 248 152 324 A 104 104 0 0 0 360 324 C 360 248 256 120 256 120 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#subtleDrop)" />
</svg>
